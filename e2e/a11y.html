<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Planora accessibility test harness</title>
    <style>
      body {
        margin: 0;
        font: 14px system-ui;
        background: #f6f5ed;
        color: #173d31;
      }
      header {
        padding: 12px 20px;
        display: flex;
        align-items: center;
        gap: 20px;
      }
      h1 {
        font-size: 16px;
        margin: 0;
      }
      button {
        padding: 9px 15px;
        background: #173d31;
        color: white;
        border: 0;
        border-radius: 4px;
      }
      iframe {
        width: 100%;
        height: 80vh;
        border: 0;
        background: white;
      }
      pre {
        margin: 0;
        padding: 15px 20px;
        white-space: pre-wrap;
        font: 12px monospace;
      }
      button:focus-visible {
        outline: 3px solid #9a733a;
        outline-offset: 3px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Planora · Development accessibility harness</h1>
      <button id="audit">Run accessibility check</button
      ><label
        >Viewport
        <select id="viewport">
          <option value="desktop">Desktop</option>
          <option value="mobile">Mobile (390px)</option>
        </select></label
      >
    </header>
    <pre id="result" role="status">
Open a planning section in the frame, then run an automated axe check. This harness is not part of the production build.</pre
    >
    <iframe
      id="app"
      src="/e2e/a11y-app.html"
      title="Planora application under test"
    ></iframe>
    <script type="module" src="/e2e/a11y.ts"></script>
  </body>
</html>
